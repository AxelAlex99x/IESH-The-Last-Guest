<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>The Last Guest</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="js/scene.js"></script>
</head>

<body>
    <a-scene>
        <a-assets>
            <img id="pano-room" src="assets/lythwood_room.jpg">
            <img id="pano-lounge" src="assets/lythwood_lounge.jpg">
            <img id="pano-terrace" src="assets/lythwood_terrace.jpg">
            <img id="note" src="assets/note.png">
            <img id="arrow" src="assets/arrow.png">
            <img id="bird" src="assets/bird.png">
        </a-assets>

        <a-sky id="sky" src="#pano-room" rotation="0 -90 0"></a-sky>

        <a-entity camera look-controls position="0 1.6 0">
            <a-entity id="cursor" cursor="rayOrigin: mouse" raycaster="objects: .clickable:not(.inactive)"></a-entity>
        </a-entity>

        <a-entity id="room">

  <!-- Intro text over the window -->
  <a-entity position="0 1.6 0" rotation="5 -39 0">
    <a-plane position="0 0 -3.5" width="2.6" height="0.9" color="#000" opacity="0.55"></a-plane>
    <a-text position="0 0 -3.49" align="center" width="2.4" color="#fff"
            value="Mistvale Lodge, 6:12 AM.\nThe house is empty.\nRead the note on the dressing table."></a-text>
  </a-entity>

  <!-- Digit 1: on the mantel clock -->
  <a-entity position="0 1.6 0" rotation="2 -120 0">
    <a-text value="1" position="0 0.15 -4" align="center" width="10" color="#ffd36b"
            animation="property: text.opacity; from: 0.3; to: 1; dir: alternate; loop: true; dur: 1500"></a-text>
  </a-entity>

  <!-- Digit 2: on the mirror -->
  <a-entity position="0 1.6 0" rotation="-6 59 0">
    <a-text value="9" position="0 0 -4" align="center" width="10" color="#ffd36b"
            animation="property: text.opacity; from: 0.3; to: 1; dir: alternate; loop: true; dur: 1500"></a-text>
  </a-entity>

  <!-- Small note lying on the dressing table -->
  <a-entity position="0 1.6 0" rotation="-20 70 0">
    <a-image src="#note" class="clickable" toggle="target: #noteBig"
             position="0 0 -3" width="0.35" height="0.35"
             material="transparent: true; alphaTest: 0.5"
             animation__enter="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
             animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-image>
  </a-entity>

  <!-- Big readable note (hidden until clicked) -->
  <a-entity id="noteBig" visible="false" position="0 1.6 0" rotation="-5 59 0">
    <a-image src="#note" position="0 0 -2" width="1.4" height="1.4"
             material="transparent: true; alphaTest: 0.5"></a-image>
    <a-text position="-0.03 0.04 -1.99" rotation="0 0 4"
        align="left" anchor="center" width="0.85" wrap-count="28" color="#3a2a1a"
        value="Dear guest,\nI had to leave before dawn. The garden door locks itself at night. Its code is the year this house was built.\nI hid the four digits where I like to sit: by the clock, at the mirror, at the piano, by the stove. In that order.\nBreakfast is on the terrace.\n- M."></a-text>
  </a-entity>

  <!-- Arrow hotspot at the white door: go to the lounge -->
  <a-entity position="0 1.6 0" rotation="-4 113 0">
    <a-circle class="clickable" go-to="target: lounge" position="0 0 -4" radius="0.4"
              color="#000" opacity="0.4"
              animation__enter="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
              animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
      <a-ring radius-inner="0.36" radius-outer="0.4" color="#fff" position="0 0 0.01"></a-ring>
      <a-image src="#arrow" width="0.5" height="0.5" position="0 0 0.02"
               material="transparent: true; alphaTest: 0.5"></a-image>
      <a-text value="To the lounge" align="center" position="0 -0.6 0" width="3"></a-text>
    </a-circle>
  </a-entity>

</a-entity>

        <a-entity id="lounge" visible="false">

  <!-- Hint text where you arrive -->
  <a-entity position="0 1.6 0" rotation="8 85 0">
    <a-plane position="0 0 -3.5" width="2.4" height="0.7" color="#000" opacity="0.55"></a-plane>
    <a-text position="0 0 -3.49" align="center" width="2.2" color="#fff"
            value="The lounge.\nTwo more digits... then the garden door."></a-text>
  </a-entity>

  <!-- Digit 3: on the piano -->
  <a-entity position="0 1.6 0" rotation="-7 63 0">
    <a-text value="0" position="0 0 -4" align="center" width="10" color="#ffd36b"
            animation="property: text.opacity; from: 0.3; to: 1; dir: alternate; loop: true; dur: 1500"></a-text>
  </a-entity>

  <!-- Digit 4: on the wood stove -->
  <a-entity position="0 1.6 0" rotation="-8 -103 0">
    <a-text value="7" position="0 0 -4" align="center" width="10" color="#ffd36b"
            animation="property: text.opacity; from: 0.3; to: 1; dir: alternate; loop: true; dur: 1500"></a-text>
  </a-entity>

  <!-- The dark wooden door: outline, label, keypad box, keypad -->
  <a-entity position="0 1.6 0" rotation="0 37 0">
    <!-- outline made of 4 lines -->
    <a-entity
      line="start: -0.42 0.68 -4; end: 0.42 0.68 -4; color: #ffd36b"
      line__2="start: 0.42 0.68 -4; end: 0.42 -1.2 -4; color: #ffd36b"
      line__3="start: 0.42 -1.2 -4; end: -0.42 -1.2 -4; color: #ffd36b"
      line__4="start: -0.42 -1.2 -4; end: -0.42 0.68 -4; color: #ffd36b"></a-entity>

    <a-text id="doorLabel" value="Garden door: locked" position="0.25 0.9 -4"
            align="center" width="3" color="#ff6b6b"></a-text>

    <!-- pulsing keypad box on the stone wall, right of the door -->
    <a-box id="doorBox" class="clickable" open-keypad
           position="0.55 -0.2 -4" width="0.15" height="0.22" depth="0.04"
           material="color: #400; emissive: #f00; emissiveIntensity: 0.3"
           animation="property: material.emissiveIntensity; from: 0.2; to: 1; dir: alternate; loop: true; dur: 800"></a-box>

    <!-- keypad, hidden until the box is clicked -->
    <a-entity id="keypad" visible="false" keypad="code: 1907" position="0 -0.1 -2.5"></a-entity>
  </a-entity>

  <!-- Arrow back to the bedroom -->
  <a-entity position="0 1.6 0" rotation="-2 108 0">
    <a-circle class="clickable" go-to="target: room" position="0 0 -4" radius="0.4"
              color="#000" opacity="0.4"
              animation__enter="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
              animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
      <a-ring radius-inner="0.36" radius-outer="0.4" color="#fff" position="0 0 0.01"></a-ring>
      <a-image src="#arrow" width="0.5" height="0.5" position="0 0 0.02"
               material="transparent: true; alphaTest: 0.5"></a-image>
      <a-text value="To the bedroom" align="center" position="0 -0.6 0" width="3"></a-text>
    </a-circle>
  </a-entity>

</a-entity>
        <a-entity id="terrace" visible="false">

  <!-- Mist that lifts when you step outside -->
  <a-sphere class="on-enter" radius="30"
            material="color: #ffffff; opacity: 0.75; transparent: true; side: back; shader: flat"
            animation="property: material.opacity; from: 0.75; to: 0; dur: 4000; easing: easeInOutQuad; startEvents: show"></a-sphere>

  <!-- Finale text over the house -->
  <a-entity position="0 1.6 0" rotation="12 -18 0">
    <a-entity id="finale" class="on-enter" position="0 0 -4" scale="0 0 0"
              animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 1500; delay: 1500; easing: easeOutElastic; startEvents: show">
      <a-plane width="3" height="0.9" color="#000" opacity="0.5"></a-plane>
      <a-text position="0 0 0.01" align="center" width="2.8" color="#fff"
              value="Welcome outside, last guest.\nBreakfast is served."></a-text>
    </a-entity>
  </a-entity>

  <!-- Birds taking off from the tree on the lawn -->
  <a-entity position="0 1.6 0" rotation="15 60 0">
    <a-image src="#bird" width="0.4" height="0.4" material="transparent: true; alphaTest: 0.5"
             animation="property: position; from: -1.5 0 -6; to: 4 2.5 -8; dur: 5000; loop: true; easing: easeInQuad"></a-image>
    <a-image src="#bird" width="0.3" height="0.3" material="transparent: true; alphaTest: 0.5"
             animation="property: position; from: -1.3 -0.2 -6; to: 3.5 3 -9; dur: 6000; delay: 800; loop: true; easing: easeInQuad"></a-image>
    <a-image src="#bird" width="0.35" height="0.35" material="transparent: true; alphaTest: 0.5"
             animation="property: position; from: -1.7 0.1 -6; to: 4.5 2 -7; dur: 4500; delay: 1600; loop: true; easing: easeInQuad"></a-image>
    <a-image src="#bird" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.5"
             animation="property: position; from: -1.4 0.2 -6; to: 3 3.5 -10; dur: 7000; delay: 2400; loop: true; easing: easeInQuad"></a-image>
  </a-entity>

  <!-- Breakfast on the white table -->
<a-entity rotation="0 -81 0">
  <a-entity id="breakfast" class="on-enter" position="0 0.76 -5.2" scale="0 0 0"
            animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 3000; easing: easeOutBack; startEvents: show">

    <!-- plate -->
    <!-- plate: pale blue with a darker rim so the food stands out -->
<a-cylinder radius="0.2" height="0.02" position="0 0.01 0" color="#d6e6f2"></a-cylinder>
<a-torus radius="0.19" radius-tubular="0.01" rotation="-90 0 0" position="0 0.02 0" color="#5b8db8"></a-torus>

<!-- fried egg: two overlapping white discs + yolk -->
<a-cylinder radius="0.075" height="0.008" position="-0.07 0.024 0.02" color="#ffffff"></a-cylinder>
<a-cylinder radius="0.05" height="0.008" position="-0.1 0.024 -0.03" color="#ffffff"></a-cylinder>
<a-sphere radius="0.032" scale="1 0.5 1" position="-0.07 0.03 0.02" color="#ffa000"></a-sphere>

<!-- toast: dark crust + lighter bread on top -->
<a-box width="0.12" height="0.02" depth="0.11" rotation="0 20 0" position="0.08 0.03 -0.06" color="#a8642c"></a-box>
<a-box width="0.105" height="0.021" depth="0.095" rotation="0 20 0" position="0.08 0.031 -0.06" color="#e8c07a"></a-box>

<!-- bacon: two thin red-brown strips -->
<a-box width="0.15" height="0.006" depth="0.03" rotation="0 -25 0" position="0.06 0.024 0.06" color="#a33b2a"></a-box>
<a-box width="0.15" height="0.006" depth="0.03" rotation="0 -15 0" position="0.07 0.027 0.105" color="#b5472f"></a-box>
    <!-- coffee cup -->
    <a-cylinder radius="0.05" height="0.08" position="0.32 0.04 0" color="#ffffff"></a-cylinder>
    <a-circle radius="0.045" rotation="-90 0 0" position="0.32 0.081 0" color="#4b2e1e"></a-circle>
    <a-torus arc="180" radius="0.025" radius-tubular="0.006" rotation="0 0 -90" position="0.37 0.045 0" color="#ffffff"></a-torus>

    <!-- steam rising from the cup -->
    <a-sphere radius="0.015" position="0.32 0.09 0" material="color: #fff; transparent: true; opacity: 0.6"
              animation="property: position; from: 0.32 0.09 0; to: 0.33 0.3 0; dur: 2000; loop: true"
              animation__fade="property: material.opacity; from: 0.6; to: 0; dur: 2000; loop: true"></a-sphere>
    <a-sphere radius="0.012" position="0.31 0.09 0.01" material="color: #fff; transparent: true; opacity: 0.6"
              animation="property: position; from: 0.31 0.09 0.01; to: 0.30 0.28 0.01; dur: 2400; delay: 1000; loop: true"
              animation__fade="property: material.opacity; from: 0.6; to: 0; dur: 2400; delay: 1000; loop: true"></a-sphere>
  </a-entity>
</a-entity>
</a-entity>
    </a-scene>
</body>

</html>
